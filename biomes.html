<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dimension & Biomes | DinosExpansion Wiki</title>
  <meta name="description" content="Explore the pocket dimension Sector-B9, its Redwood Canopy and Bioluminescent Caverns, key features, and spawning dinos.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/images/trex.png">
  <style>
    /* Biome-specific custom styles */
    .biome-layout {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      margin-top: 2rem;
    }
    
    .biome-card {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      position: relative;
      padding: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    
    @media (max-width: 900px) {
      .biome-card {
        grid-template-columns: 1fr;
      }
    }
    
    .biome-card::before, .biome-card::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 15px;
      border: 2px solid var(--color-cyan);
      pointer-events: none;
    }
    .biome-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .biome-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    
    .biome-img-box {
      border: 1px solid var(--panel-border);
      aspect-ratio: 16/10;
      overflow: hidden;
      position: relative;
    }
    
    .biome-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .hazard-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 0.3rem 0.8rem;
      font-family: var(--font-hud);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      background: rgba(5, 10, 8, 0.85);
      border: 1px solid #fff;
      text-transform: uppercase;
    }
    
    .hazard-medium {
      color: var(--color-orange);
      border-color: var(--color-orange);
      text-shadow: 0 0 5px var(--color-orange-glow);
    }
    
    .hazard-high {
      color: var(--color-red);
      border-color: var(--color-red);
      text-shadow: 0 0 5px var(--color-red-glow);
    }
    
    .features-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    
    .feature-item {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--color-cyan);
      padding: 0.6rem 1rem;
    }
    
    .feature-name {
      font-family: var(--font-title);
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    
    .feature-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    
    .spawns-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-hud);
      font-size: 1.05rem;
      margin-top: 1rem;
    }
    
    .spawns-table th, .spawns-table td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .spawns-table th {
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--panel-border);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo" id="header-logo">
        <span class="logo-implant"></span>
        DinosExpansion
      </a>
      <nav id="main-navigation">
        <a href="index.html" class="nav-link">Catalog</a>
        <a href="calculator.html" class="nav-link">Taming Calculator</a>
        <a href="guides.html" class="nav-link">Guides</a>
        <a href="biomes.html" class="nav-link active">Biomes</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="biomes-page-container">
    
    <!-- Dimension Telemetry Banner -->
    <section class="hud-panel" style="margin-bottom: 3rem;">
      <h1 id="dimension-name" style="font-family: var(--font-title); font-size: 2.5rem; color: var(--color-cyan); text-shadow: 0 0 15px var(--color-cyan-glow); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem;">DIMENSION: CODENAME</h1>
      <p id="dimension-sector" style="font-family: var(--font-hud); font-size: 1.2rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1.5rem;">SECTOR SIGNAL: ON</p>
      <p id="dimension-description" style="font-size: 1.05rem; line-height: 1.7; color: #c4d7d2; border-top: 1px solid var(--panel-border); padding-top: 1.5rem;">
        Dimension telemetry information loading...
      </p>
    </section>

    <!-- Biomes List Container (Populated dynamically) -->
    <section class="biome-layout" id="biome-layout" aria-label="Dimension Biomes">
      <!-- Loaded dynamically via js/app.js -->
    </section>

  </main>

  <!-- Footer -->
  <footer id="main-footer">
    <p>NEURAL LINK SECURED // SYSTEM: <span>ACTIVE</span> // NODE LAT: 35.2 LON: 88.4</p>
    <p style="font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.6;">&copy; 2026 Bretzelfresser. Designed for DinosExpansion. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/biomes-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
